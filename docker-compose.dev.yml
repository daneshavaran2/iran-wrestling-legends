version: '3.8'

services:
  museum-dev:
    image: node:18-alpine
    container_name: wrestling-museum-dev
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - NODE_ENV=development
    restart: unless-stopped
    labels:
      - "app.name=wrestling-museum-dev"
      - "app.environment=development"
