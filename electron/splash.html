<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موزه کشتی ایران</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      width: 500px;
      height: 400px;
      background: radial-gradient(ellipse at center, #1a1a1a 0%, #0a0a0a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
      color: white;
      overflow: hidden;
      border-radius: 20px;
      -webkit-app-region: drag;
    }
    
    .glow {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(205, 127, 50, 0.3) 0%, transparent 70%);
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 0.8; }
    }
    
    .logo-container {
      position: relative;
      z-index: 10;
      margin-bottom: 30px;
    }
    
    .logo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid rgba(205, 127, 50, 0.5);
      box-shadow: 0 0 30px rgba(205, 127, 50, 0.4);
      animation: float 3s ease-in-out infinite;
      object-fit: cover;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    .ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 150px;
      height: 150px;
      border: 2px solid rgba(205, 127, 50, 0.3);
      border-radius: 50%;
      animation: ring-pulse 2s ease-in-out infinite;
    }
    
    .ring:nth-child(2) {
      animation-delay: 0.5s;
      width: 180px;
      height: 180px;
    }
    
    @keyframes ring-pulse {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
      100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
    }
    
    h1 {
      color: #cd7f32;
      font-size: 24px;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(205, 127, 50, 0.5);
      letter-spacing: 1px;
    }
    
    p {
      color: #888;
      font-size: 14px;
      margin-bottom: 30px;
      font-style: italic;
    }
    
    .progress-container {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }
    
    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #cd7f32, #ff8c00);
      border-radius: 2px;
      animation: loading 2.5s ease-in-out forwards;
    }
    
    @keyframes loading {
      0% { width: 0%; }
      20% { width: 20%; }
      50% { width: 60%; }
      80% { width: 85%; }
      100% { width: 100%; }
    }
    
    .loading-text {
      margin-top: 15px;
      font-size: 12px;
      color: #666;
      animation: blink 1.5s infinite;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .particles {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
    }
    
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #cd7f32;
      border-radius: 50%;
      opacity: 0;
      animation: sparkle 3s infinite;
    }
    
    @keyframes sparkle {
      0% { opacity: 0; transform: translateY(0) scale(0); }
      50% { opacity: 1; transform: translateY(-20px) scale(1); }
      100% { opacity: 0; transform: translateY(-40px) scale(0.5); }
    }
    
    .version {
      position: absolute;
      bottom: 15px;
      font-size: 10px;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  
  <div class="particles" id="particles"></div>
  
  <div class="logo-container">
    <div class="ring"></div>
    <div class="ring"></div>
    <img src="app-icon.png" alt="Logo" class="logo" onerror="this.style.display='none'">
  </div>
  
  <h1>موزه افتخارات کشتی ایران</h1>
  <p>Iran Wrestling Museum</p>
  
  <div class="progress-container">
    <div class="progress-bar"></div>
  </div>
  
  <div class="loading-text">در حال بارگذاری...</div>
  
  <div class="version">نسخه 1.0.0</div>
  
  <script>
    // Generate random particles
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 20; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.top = (50 + Math.random() * 50) + '%';
      particle.style.animationDelay = Math.random() * 3 + 's';
      particle.style.animationDuration = (2 + Math.random() * 2) + 's';
      particlesContainer.appendChild(particle);
    }
  </script>
</body>
</html>
