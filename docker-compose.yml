version: '3.8'

services:
  museum:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wrestling-museum
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "app.name=wrestling-museum"
      - "app.description=Iran Wrestling Museum"

# Optional: Add reverse proxy with SSL
# networks:
#   default:
#     name: museum-network
